<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: #1f2937; background: #f7f7f8; }
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  .sidebar { width: 240px; flex-shrink: 0; background: #fff; border-right: 1px solid #ffe8d6; padding: 16px 12px; }
  .brand { color: #f97316; font-weight: 800; font-size: 22px; padding: 8px 12px 16px; }
  nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 10px 12px; border-radius: 12px; font-size: 14px; color: #4b5563; cursor: pointer; line-height: 1.2; }
  .nav-btn:hover { background: #fff7ed; }
  .nav-btn.active { background: #ffedd5; color: #ea580c; font-weight: 600; }
  .nav-btn span { font-size: 16px; }

  /* Contenido */
  .content { flex: 1; overflow-y: auto; }
  .head { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid #ffe8d6; background: #fff; }
  .head .ico { width: 40px; height: 40px; border-radius: 10px; background: #ffedd5; color: #ea580c; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .head h1 { margin: 0; font-size: 22px; }
  .head p { margin: 2px 0 0; color: #6b7280; font-size: 13px; }
  .body { padding: 24px; }
  .loading { padding: 40px; color: #9ca3af; }

  /* Card / tabla */
  .card { background: #fff; border: 1px solid #fed7aa; border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
  .card-pad { padding: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #9ca3af; padding: 10px 12px; background: #fff7ed; }
  td { padding: 10px 12px; font-size: 14px; border-top: 1px solid #ffedd5; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #fff7ed; }
  .search { width: 100%; padding: 10px 14px; border: 1px solid #fed7aa; border-radius: 12px; font-size: 14px; margin-bottom: 14px; }

  .pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill-cli { background: #dbeafe; color: #2563eb; }
  .pill-pros { background: #ede9fe; color: #7c3aed; }
  .pill-ok { background: #d1fae5; color: #059669; }
  .pill-warn { background: #fef3c7; color: #d97706; }
  .pill-bad { background: #fee2e2; color: #dc2626; }
  .pill-gray { background: #e5e7eb; color: #4b5563; }

  .btn { border: 0; border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #f97316; color: #fff; }
  .btn-primary:hover { background: #ea580c; }
  .btn-ghost { background: #fff7ed; color: #ea580c; }
  .btn-wa { background: #16a34a; color: #fff; }
  .btn-mail { background: #f97316; color: #fff; }
  .btn-call { background: #2563eb; color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* Flash cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .flash { text-align: left; background: #fff; border: 1px solid #fed7aa; border-radius: 16px; padding: 18px; cursor: pointer; transition: .15s; }
  .flash:hover { box-shadow: 0 6px 18px rgba(0,0,0,.06); transform: translateY(-2px); border-color: #fdba74; }
  .flash .fi { width: 44px; height: 44px; border-radius: 12px; background: #ffedd5; color: #ea580c; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 10px; }
  .flash .ft { font-weight: 700; }
  .flash .fa { color: #f97316; font-size: 13px; margin-top: 10px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #ffe8d6; margin-bottom: 16px; overflow-x: auto; }
  .tab { border: 0; background: transparent; padding: 10px 12px; font-size: 14px; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.active { color: #ea580c; border-bottom-color: #f97316; font-weight: 600; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; }
  .kpi { background: #fff7ed; border-radius: 12px; padding: 12px; }
  .kpi .l { font-size: 12px; color: #9ca3af; }
  .kpi .v { font-size: 20px; font-weight: 800; }

  .field { margin-bottom: 10px; }
  .field .fl { font-size: 11px; text-transform: uppercase; color: #9ca3af; margin-bottom: 4px; }
  .field .fv { padding: 8px 10px; border: 1px solid #e5e7eb; background: #f9fafb; border-radius: 10px; font-size: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field select, .field input, .field textarea { width: 100%; }
  select, input[type=text], input[type=email], input[type=tel], input[type=number], textarea { padding: 8px 10px; border: 1px solid #fed7aa; border-radius: 10px; font-size: 14px; font-family: inherit; }

  /* Overlay */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .overlay.show { display: flex; }
  .overlay-card { background: #f7f7f8; border-radius: 16px; width: 100%; max-width: 1000px; height: 92vh; overflow: hidden; display: flex; flex-direction: column; }
  .ov-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: #fff; border-bottom: 1px solid #ffe8d6; }
  .ov-body { display: flex; flex: 1; min-height: 0; }
  .ov-nav { width: 200px; flex-shrink: 0; background: #fff; border-right: 1px solid #ffe8d6; padding: 12px; }
  .ov-main { flex: 1; overflow-y: auto; padding: 18px; }
  .x { border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #6b7280; }
  .muted { color: #9ca3af; font-size: 13px; }
  .chip { padding: 4px 10px; border: 1px solid #fed7aa; border-radius: 999px; font-size: 12px; background: #fff; cursor: pointer; margin: 0 6px 6px 0; }
  .chip.sel { background: #ffedd5; border-color: #fdba74; color: #ea580c; }
  h3.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #ea580c; margin: 0 0 10px; }

  /* Filtros multiselect en cascada */
  .filtros { background: #fff; border: 1px solid #fed7aa; border-radius: 14px; padding: 12px; margin-bottom: 16px; }
  .filtros-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .filtros-top .fcount { margin-left: 6px; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #ffedd5; color: #ea580c; }
  .filtros-clr { border: 0; background: transparent; color: #ea580c; font-size: 12px; cursor: pointer; }
  .filtros-clr:hover { text-decoration: underline; }
  .frow { display: flex; flex-wrap: wrap; gap: 10px; }
  .fcol { position: relative; }
  .fcol .flbl { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; color: #9ca3af; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
  .fcol .flvl { padding: 0 4px; border-radius: 4px; background: #ffedd5; color: #ea580c; font-size: 9px; }
  .fbtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 150px; padding: 8px 10px; border: 1px solid #fed7aa; border-radius: 10px; background: #fff; color: #4b5563; font-size: 13px; cursor: pointer; }
  .fbtn.on { border-color: #fdba74; background: #fff7ed; color: #1f2937; }
  .fbtn .car { opacity: .5; font-size: 10px; }
  .fpanel { position: absolute; z-index: 30; margin-top: 4px; width: 240px; background: #fff; border: 1px solid #fed7aa; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 8px; }
  .fpanel .fsearch { width: 100%; margin-bottom: 8px; padding: 6px 8px; border: 1px solid #fed7aa; border-radius: 8px; font-size: 13px; }
  .fpanel .facts { display: flex; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  .fpanel .facts button { border: 0; background: transparent; cursor: pointer; padding: 0; }
  .fpanel .facts .all { color: #ea580c; }
  .fpanel .facts .none { color: #9ca3af; }
  .fopts { max-height: 200px; overflow-y: auto; }
  .fopt { display: flex; align-items: center; gap: 8px; padding: 4px 4px; font-size: 13px; border-radius: 6px; cursor: pointer; color: #4b5563; }
  .fopt:hover { background: #fff7ed; }
  .fempty { font-size: 12px; color: #9ca3af; padding: 4px; }

  /* Toolbar tabla ofertas */
  .tbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: #fff7ed; border-bottom: 1px solid #ffedd5; }
  .tbar .info { font-size: 13px; color: #6b7280; }
  .tbar .acts { display: flex; gap: 8px; }
  .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .btn-out { background: #fff; border: 1px solid #fed7aa; color: #ea580c; }
  .btn-out:disabled { color: #9ca3af; border-color: #e5e7eb; }
  .pager { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-top: 1px solid #ffedd5; }
  .pager button { border: 0; background: transparent; color: #ea580c; font-size: 13px; cursor: pointer; padding: 6px 10px; border-radius: 8px; }
  .pager button:disabled { color: #cbd5e1; cursor: default; }
  .pager .pp { font-size: 13px; color: #6b7280; }
  th.c, td.c { text-align: center; }

  /* Modal genérico */
  .modal-card { background: #fff; border-radius: 16px; width: 100%; max-width: 460px; max-height: 80vh; overflow: auto; padding: 18px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .modal-head h2 { margin: 0; font-size: 18px; }
  .lista { border: 1px solid #fed7aa; border-radius: 10px; max-height: 300px; overflow: auto; margin-top: 8px; }
  .lista button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #ffedd5; }
  .lista button:hover { background: #fff7ed; }
  .lista button:last-child { border-bottom: 0; }

  /* Ciclo 360 */
  .tabn { font-size: 10px; padding: 0 6px; border-radius: 999px; background: #ffedd5; color: #ea580c; }
  .donut { width: 128px; height: 128px; border-radius: 50%; position: relative; flex-shrink: 0; }
  .donut-hole { position: absolute; inset: 22%; border-radius: 50%; background: #fff; }
  .bars { display: flex; align-items: flex-end; gap: 12px; height: 150px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar-pair { display: flex; align-items: flex-end; gap: 2px; height: 120px; width: 100%; justify-content: center; }
  .bar { width: 12px; border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar-in { background: #3b82f6; }
  .bar-eg { background: #f59e0b; }
  .leg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
  .prog { height: 6px; border-radius: 999px; background: #e5e7eb; overflow: hidden; margin-top: 8px; }
  .prog-fill { height: 100%; background: #3b82f6; }
  .trk { flex: 1; height: 16px; border-radius: 6px; background: #f3f4f6; overflow: hidden; }
  .acc { border: 1px solid #ffedd5; border-radius: 10px; margin-bottom: 6px; overflow: hidden; }
  .acc-h { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border: 0; font-size: 14px; text-align: left; cursor: pointer; }
  .acc-h:hover { background: #fff7ed; }
  .acc-b { padding: 0 12px 12px 30px; font-size: 14px; }

  /* ===== Réplica pantalla Chat (Asistente IA / Cotizador) ===== */
  .chatx { display: flex; height: 100%; overflow: hidden; background: linear-gradient(to bottom, #fff7ed80, #ffffff, #fff7ed4d); }
  .chatx-main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .chatx-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #ffedd5; background: rgba(255,255,255,.85); }
  .chatx-head .l { display: flex; align-items: center; gap: 16px; }
  .chatx-ava { width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; background: linear-gradient(135deg, #fb923c, #ea580c); box-shadow: 0 8px 20px rgba(234,88,12,.25); }
  .chatx-title { font-size: 18px; font-weight: 800; margin: 0; }
  .chatx-badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; background: #ffedd5; color: #ea580c; border: 1px solid #fed7aa; }
  .chatx-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6b7280; margin-top: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .chatx-acts { display: flex; gap: 8px; }
  .chatx-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; border: 0; cursor: pointer; }
  .chatx-btn.nueva { background: #fff7ed; color: #ea580c; }
  .chatx-btn.nueva:hover { background: #ffedd5; }
  .chatx-btn.limpiar { background: #fef2f2; color: #ef4444; }
  .chatx-btn.limpiar:hover { background: #fee2e2; }
  .chatx-body { flex: 1; overflow-y: auto; padding: 24px; }
  .chatx-foot { border-top: 1px solid #ffedd5; background: rgba(255,255,255,.85); padding: 16px; }
  .chatx-foot-in { max-width: 880px; margin: 0 auto; }
  .modes { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .mode { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; border: 1px solid #e5e7eb; background: #f9fafb; color: #9ca3af; cursor: pointer; }
  .mode.active { background: linear-gradient(to right, #ffedd5, #fef3c7); color: #c2410c; border-color: #fdba74; }
  .inputbox { display: flex; align-items: flex-end; gap: 12px; padding: 8px; border: 1px solid #fed7aa; border-radius: 16px; background: #fff; }
  .inputbox textarea { flex: 1; resize: none; border: 0; background: transparent; padding: 10px 12px; font-size: 15px; min-height: 46px; max-height: 150px; outline: none; font-family: inherit; }
  .send-btn { width: 48px; height: 48px; border-radius: 12px; border: 0; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; font-size: 18px; background: linear-gradient(135deg, #fb923c, #ea580c); box-shadow: 0 8px 20px rgba(234,88,12,.3); }
  .send-btn:disabled { background: #e5e7eb; color: #cbd5e1; cursor: not-allowed; box-shadow: none; }
  .hint { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 12px; }
  .hint kbd { padding: 1px 6px; border-radius: 4px; background: #f3f4f6; font-family: monospace; font-size: 11px; }

  /* Burbujas */
  .bub { display: flex; gap: 12px; margin-bottom: 20px; }
  .bub.u { flex-direction: row-reverse; }
  .bub-ava { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; box-shadow: 0 6px 16px rgba(0,0,0,.12); }
  .bub.u .bub-ava { background: linear-gradient(135deg, #60a5fa, #2563eb); }
  .bub.b .bub-ava { background: linear-gradient(135deg, #fb923c, #ea580c); }
  .bub-col { display: flex; flex-direction: column; max-width: 78%; }
  .bub.u .bub-col { align-items: flex-end; }
  .bub-body { padding: 12px 18px; border-radius: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.05); font-size: 14px; line-height: 1.5; }
  .bub.u .bub-body { background: linear-gradient(135deg, #fb923c, #f97316); color: #fff; border-top-right-radius: 6px; white-space: pre-wrap; }
  .bub.b .bub-body { background: #fff; color: #1f2937; border: 1px solid #ffedd5; border-top-left-radius: 6px; white-space: pre-wrap; }
  .bub.b .bub-body table { white-space: normal; }
  .bub-time { font-size: 11px; color: #9ca3af; margin-top: 6px; padding: 0 4px; }
  .typing { display: inline-flex; gap: 4px; align-items: center; }
  .typing span { width: 8px; height: 8px; border-radius: 50%; background: #fb923c; display: inline-block; animation: typb 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes typb { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }

  /* Bienvenida */
  .wel { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; text-align: center; padding: 40px 24px; }
  .wel-ico { width: 96px; height: 96px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 46px; margin-bottom: 28px; background: linear-gradient(135deg, #fb923c, #f97316, #ea580c); box-shadow: 0 20px 40px rgba(234,88,12,.3); }
  .wel-title { font-size: 30px; font-weight: 800; margin: 0 0 10px; background: linear-gradient(to right, #f97316, #ea580c, #c2410c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .wel-desc { color: #6b7280; max-width: 520px; margin: 0 0 36px; font-size: 16px; line-height: 1.6; }
  .wel-sub { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-bottom: 14px; }
  .wel-grid { width: 100%; max-width: 680px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .wel-card { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 16px; text-align: left; border: 1px solid #ffedd5; background: #fff7ed; cursor: pointer; transition: .2s; }
  .wel-card:hover { background: #ffedd5; border-color: #fdba74; transform: translateY(-2px); box-shadow: 0 10px 24px rgba(234,88,12,.1); }
  .wel-card .ci { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #ffedd5; color: #ea580c; font-size: 20px; }
  .wel-card .cl { font-size: 14px; font-weight: 600; color: #374151; }

  /* Biblioteca de Prompts */
  .plib { width: 320px; flex-shrink: 0; border-left: 1px solid #e5e7eb; background: #f9fafb; display: flex; flex-direction: column; height: 100%; }
  .plib-head { padding: 16px; border-bottom: 1px solid #e5e7eb; }
  .plib-head h3 { margin: 0 0 4px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .plib-head p { margin: 0; font-size: 12px; color: #6b7280; }
  .plib-search { padding: 12px; }
  .plib-search input { width: 100%; padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 14px; }
  .plib-list { flex: 1; overflow-y: auto; padding: 12px; }
  .plib-cat { margin-bottom: 14px; }
  .plib-cat-h { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border: 0; background: transparent; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; cursor: pointer; border-radius: 6px; }
  .plib-cat-h:hover { background: #f3f4f6; }
  .plib-cat-h .ct { display: flex; align-items: center; gap: 8px; }
  .plib-cat-h .car { transition: transform .2s; }
  .plib-cat-h.open .car { transform: rotate(90deg); }
  .plib-prompt { width: 100%; text-align: left; padding: 10px 12px; font-size: 14px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: #4b5563; cursor: pointer; margin-bottom: 2px; }
  .plib-prompt:hover { background: #fff; color: #ea580c; border-color: #ffedd5; box-shadow: 0 1px 2px rgba(0,0,0,.04); }

  /* ===== Tareas y Agenda ===== */
  .tareas-wrap { display: flex; height: 100%; overflow: hidden; background: linear-gradient(to bottom, #fff7ed80, #ffffff, #fff7ed4d); }
  .tareas-left { flex: 1; overflow-y: auto; padding: 24px; min-width: 0; }
  .tareas-title { font-size: 24px; font-weight: 800; margin: 0 0 24px; }
  .tareas-right { width: 420px; flex-shrink: 0; border-left: 1px solid #fed7aa; background: #fff; height: 100%; }
  .acc2 { border: 1px solid #fed7aa; border-radius: 14px; overflow: hidden; background: #fff; margin-bottom: 16px; }
  .acc2-h { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: 0; background: transparent; cursor: pointer; font-size: 15px; }
  .acc2-h:hover { background: #fff7ed; }
  .acc2-t { font-weight: 700; color: #1f2937; display: flex; align-items: center; gap: 10px; }
  .acc2-b { border-top: 1px solid #ffedd5; padding: 14px 16px; }

  /* Mi Día */
  .td-prog { background: #fff7ed; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .td-prog-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; gap: 12px; flex-wrap: wrap; }
