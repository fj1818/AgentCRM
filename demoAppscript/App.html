<script>
(function () {
  var SEED = null, OFERTAS = [], CLIENTES = {};
  var content = document.getElementById('content');
  var overlay = document.getElementById('overlay');
  var overlayCard = document.getElementById('overlayCard');
  var modal = document.getElementById('modal');
  var modalCard = document.getElementById('modalCard');
  var currentView = 'ofertas';

  // ---------- utilidades ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function distinct(arr) { var seen = {}, out = []; arr.forEach(function (x) { if (x != null && x !== '' && !seen[x]) { seen[x] = 1; out.push(x); } }); return out; }
  function abrirModal(html) { modalCard.innerHTML = html; modal.classList.add('show'); }
  function cerrarModal() { modal.classList.remove('show'); modalCard.innerHTML = ''; modalCard.classList.remove('wide'); }
  function money(n) { return '$' + Number(n || 0).toLocaleString('en-US'); }
  function listar(s) { return String(s || '').split(/[,;]+/).map(function (x) { return x.trim(); }).filter(Boolean); }
  function digitos(s) { return String(s).replace(/\D/g, ''); }
  function wa(s) { var d = digitos(s); return d.length === 10 ? '52' + d : d; }
  function pill(txt, cls) { return '<span class="pill ' + cls + '">' + esc(txt) + '</span>'; }
  function moraCls(b) { return b === 'Al corriente' ? 'pill-ok' : b === '90+' ? 'pill-bad' : 'pill-warn'; }
  function estatusCls(e) { return e === 'Activo' ? 'pill-ok' : e === 'Cancelado' ? 'pill-gray' : 'pill-warn'; }

  // ---------- carga ----------
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.withSuccessHandler(onSeed).withFailureHandler(function (e) {
      content.innerHTML = '<div class="body">Error cargando datos: ' + esc(e && e.message) + '</div>';
    }).getSeed();
  } else {
    content.innerHTML = '<div class="body">Vista previa local: publica como Web App en Apps Script para cargar los datos.</div>';
  }
  function onSeed(s) { SEED = s; OFERTAS = s.ofertas.slice(); (s.clientes || []).forEach(function (c) { CLIENTES[c.rfc] = c; }); render(); }

  // ---------- navegación ----------
  document.querySelectorAll('.nav-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.nav-btn').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active'); currentView = b.dataset.view; render();
    });
  });

  function render() {
    if (!SEED) return;
    if (currentView === 'ofertas') return renderOfertas();
    if (currentView === 'ciclo') return renderCiclo();
    if (currentView === 'procesos') return renderProcesos();
    if (currentView === 'tareas') return renderTareas();
    if (currentView === 'chat') return renderChat();
    if (currentView === 'cotizador') return renderCotizador();
  }

  function renderPlaceholder(ico, titulo, sub, msg) {
    content.innerHTML = head(ico, titulo, sub) +
      '<div class="body"><div class="card card-pad" style="text-align:center;border-style:dashed;color:#9ca3af">' +
      '<div style="font-size:32px">' + ico + '</div><p>' + esc(msg) + '</p></div></div>';
  }

  function head(ico, titulo, sub) {
    return '<div class="head"><div class="ico">' + ico + '</div><div><h1>' + esc(titulo) + '</h1><p>' + esc(sub) + '</p></div></div>';
  }

  // ========== OFERTAS ==========
  var OF_FILTERS = [
    { key: 'tipoPersona', label: 'Tipo de persona' },
    { key: 'tipoOferta', label: 'Tipo de oferta' },
    { key: 'familia', label: 'Familia de producto' },
    { key: 'producto', label: 'Tipo de producto' },
    { key: 'etapa', label: 'Etapa' }
  ];
  var OF_PAGE = 10;
  var ofOutside = null;
  var OF_REFRESH = null;

  function renderOfertas() {
    // Estado de filtros (cascada), búsqueda, paginación y selección
    var sel = { tipoPersona: {}, tipoOferta: {}, familia: {}, producto: {}, etapa: {} };
    var order = [];
    var openKey = null;
    var fsearch = { tipoPersona: '', tipoOferta: '', familia: '', producto: '', etapa: '' };
    var seleccion = {};
    var pagina = 1;

    content.innerHTML = '<div class="of-wrap"><div class="of-main">' +
      head('💼', 'Cartera de Ofertas', 'Gestiona y analiza tus clientes y prospectos') +
      '<div class="of-body">' +
      '<input class="search" id="ofSearch" placeholder="Buscar por nombre, promotor...">' +
      '<div id="ofFiltros"></div>' +
      '<div id="ofTabla"></div>' +
      '</div></div><div class="of-aside" id="asisOf"></div></div>';

    OF_REFRESH = function () { pagina = 1; redibujar(); };
    montarAsistenteOfertas(document.getElementById('asisOf'));

    // --- lógica de cascada ---
    function upstream(k) { var i = order.indexOf(k); return i === -1 ? order.slice() : order.slice(0, i); }
    function rowsBy(keys) { return OFERTAS.filter(function (o) { return keys.every(function (k) { return sel[k][o[k]]; }); }); }
    function optionsFor(k) { return distinct(rowsBy(upstream(k)).map(function (o) { return o[k]; })).sort(); }
    function filtradas() { return OFERTAS.filter(function (o) { return order.every(function (k) { return sel[k][o[k]]; }); }); }
    function prune() {
      var newOrder = [];
      order.forEach(function (key) {
        var avail = {};
        OFERTAS.filter(function (o) { return newOrder.every(function (k) { return sel[k][o[k]]; }); }).forEach(function (o) { avail[o[key]] = 1; });
        Object.keys(sel[key]).forEach(function (v) { if (!avail[v]) delete sel[key][v]; });
        if (Object.keys(sel[key]).length) newOrder.push(key);
      });
      order = newOrder;
    }
    function syncOrder(key) {
      var active = Object.keys(sel[key]).length > 0, i = order.indexOf(key);
      if (active && i === -1) order.push(key);
      if (!active && i !== -1) order.splice(i, 1);
      prune();
    }
    function toggle(key, value, checked) { if (checked) sel[key][value] = true; else delete sel[key][value]; syncOrder(key); }
    function setAll(key, all) { sel[key] = all ? optionsFor(key).reduce(function (a, v) { a[v] = true; return a; }, {}) : {}; syncOrder(key); }
    function limpiar() { OF_FILTERS.forEach(function (f) { sel[f.key] = {}; fsearch[f.key] = ''; }); order = []; openKey = null; pagina = 1; redibujar(); }

    // --- búsqueda + paginación sobre filtradas ---
    function conBusqueda() {
      var q = (document.getElementById('ofSearch').value || '').trim().toLowerCase();
      var base = filtradas();
      if (!q) return base;
      return base.filter(function (o) { return [o.ejecutivo, o.tipoOferta, o.familia, o.producto, o.etapa, o.fechaCierre, o.monto].join(' ').toLowerCase().indexOf(q) !== -1; });
    }

    // --- pintado ---
    function filtrosHtml() {
      return '<div class="filtros"><div class="filtros-top">' +
        '<span><b>Filtros</b><span class="fcount">' + order.length + ' ' + (order.length === 1 ? 'activo' : 'activos') + '</span></span>' +
        '<button class="filtros-clr" id="ofClr">Limpiar filtros</button></div><div class="frow">' +
        OF_FILTERS.map(function (f) {
          var lvl = order.indexOf(f.key), n = Object.keys(sel[f.key]).length;
          var opts = optionsFor(f.key).filter(function (v) { return !fsearch[f.key] || String(v).toLowerCase().indexOf(fsearch[f.key].toLowerCase()) !== -1; });
          var panel = openKey !== f.key ? '' : '<div class="fpanel">' +
            '<input class="fsearch" data-fs="' + f.key + '" placeholder="Buscar…" value="' + esc(fsearch[f.key]) + '">' +
            '<div class="facts"><button class="all" data-all="' + f.key + '">Seleccionar todos</button><button class="none" data-none="' + f.key + '">Deseleccionar</button></div>' +
            '<div class="fopts">' + (opts.length ? opts.map(function (v) {
              return '<label class="fopt"><input type="checkbox" data-ck="' + f.key + '" value="' + esc(v) + '"' + (sel[f.key][v] ? ' checked' : '') + '><span>' + esc(v) + '</span></label>';
            }).join('') : '<div class="fempty">Sin opciones</div>') + '</div></div>';
          return '<div class="fcol"><div class="flbl">' + esc(f.label) + (lvl !== -1 ? '<span class="flvl">L' + (lvl + 1) + '</span>' : '') + '</div>' +
            '<button class="fbtn ' + (lvl !== -1 ? 'on' : '') + '" data-fk="' + f.key + '"><span>' + (n ? (n + ' seleccionado' + (n > 1 ? 's' : '')) : 'Todos') + '</span><span class="car">▼</span></button>' +
            panel + '</div>';
        }).join('') + '</div></div>';
    }

    function tablaHtml() {
      var rows = conBusqueda();
      var total = Math.max(1, Math.ceil(rows.length / OF_PAGE));
      if (pagina > total) pagina = total;
      var page = rows.slice((pagina - 1) * OF_PAGE, pagina * OF_PAGE);
      var nSel = Object.keys(seleccion).filter(function (k) { return seleccion[k]; }).length;
      return '<div class="card">' +
        '<div class="tbar"><span class="info">Mostrando <b>' + rows.length + '</b> de <b>' + OFERTAS.length + '</b> ofertas</span>' +
        '<div class="acts"><button class="btn btn-primary btn-sm" id="ofNueva">+ Nueva oferta</button>' +
        '<button class="btn btn-out btn-sm" id="ofReasignar"' + (nSel ? '' : ' disabled') + '>Reasignar (' + nSel + ')</button></div></div>' +
        '<table><thead><tr>' +
        '<th>Ejecutivo</th><th>Tipo de oferta</th><th>Familia</th><th>Producto</th><th>Etapa</th><th>Monto</th><th>Fecha de cierre</th><th class="c">Detalle</th><th class="c">Reasignar</th>' +
        '</tr></thead><tbody>' +
        (page.length ? page.map(function (o) {
          var idx = OFERTAS.indexOf(o), oid = o.idOferta;
          return '<tr data-i="' + idx + '">' +
            '<td>' + esc(o.ejecutivo) + '</td>' +
            '<td>' + pill(o.tipoOferta, o.tipoOferta === 'Cliente' ? 'pill-cli' : 'pill-pros') + '</td>' +
            '<td>' + esc(o.familia) + '</td><td>' + esc(o.producto) + '</td>' +
            '<td>' + esc(o.etapa) + '</td><td>' + money(o.monto) + '</td><td>' + esc(o.fechaCierre) + '</td>' +
            '<td class="c"><button class="btn btn-out btn-sm" data-det="' + idx + '">👁</button></td>' +
            '<td class="c"><input type="checkbox" data-rs="' + esc(oid) + '"' + (seleccion[oid] ? ' checked' : '') + '></td></tr>';
        }).join('') : '<tr><td colspan="9" class="muted" style="padding:18px">Sin resultados con los filtros actuales.</td></tr>') +
        '</tbody></table>' +
        '<div class="pager"><button id="ofPrev"' + (pagina === 1 ? ' disabled' : '') + '>‹ Anterior</button>' +
        '<span class="pp">' + pagina + ' / ' + total + '</span>' +
        '<button id="ofNext"' + (pagina === total ? ' disabled' : '') + '>Siguiente ›</button></div></div>';
    }

    function redibujar() {
      document.getElementById('ofFiltros').innerHTML = filtrosHtml();
      document.getElementById('ofTabla').innerHTML = tablaHtml();
      bind();
    }

    function bind() {
      document.getElementById('ofClr').onclick = limpiar;
      document.querySelectorAll('[data-fk]').forEach(function (b) { b.onclick = function () { openKey = openKey === b.dataset.fk ? null : b.dataset.fk; redibujar(); }; });
      document.querySelectorAll('[data-ck]').forEach(function (c) { c.onclick = function (e) { e.stopPropagation(); toggle(c.dataset.ck, c.value, c.checked); pagina = 1; redibujar(); }; });
      document.querySelectorAll('[data-all]').forEach(function (b) { b.onclick = function () { setAll(b.dataset.all, true); pagina = 1; redibujar(); }; });
      document.querySelectorAll('[data-none]').forEach(function (b) { b.onclick = function () { setAll(b.dataset.none, false); pagina = 1; redibujar(); }; });
      var fs = document.querySelector('[data-fs]');
      if (fs) { fs.oninput = function () { fsearch[fs.dataset.fs] = fs.value; var k = fs.dataset.fs; document.getElementById('ofFiltros').innerHTML = filtrosHtml(); document.getElementById('ofTabla').innerHTML = tablaHtml(); bind(); var n = document.querySelector('[data-fs="' + k + '"]'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }; }
      document.querySelectorAll('[data-det]').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); abrirOferta(parseInt(b.dataset.det, 10)); }; });
      document.querySelectorAll('[data-rs]').forEach(function (c) { c.onclick = function (e) { e.stopPropagation(); seleccion[c.dataset.rs] = c.checked; redibujar(); }; });
      document.querySelectorAll('#ofTabla tr[data-i]').forEach(function (tr) { tr.classList.add('click'); tr.onclick = function () { abrirOferta(parseInt(tr.dataset.i, 10)); }; });
      var prev = document.getElementById('ofPrev'); if (prev) prev.onclick = function () { if (pagina > 1) { pagina--; redibujar(); } };
      var next = document.getElementById('ofNext'); if (next) next.onclick = function () { pagina++; redibujar(); };
      var rea = document.getElementById('ofReasignar'); if (rea) rea.onclick = function () { abrirReasignar(Object.keys(seleccion).filter(function (k) { return seleccion[k]; }), function () { seleccion = {}; redibujar(); }); };
      var nva = document.getElementById('ofNueva'); if (nva) nva.onclick = function () { abrirNuevaOferta(''); };
    }

    document.getElementById('ofSearch').addEventListener('input', function () { pagina = 1; document.getElementById('ofTabla').innerHTML = tablaHtml(); bind(); });
    // Cerrar dropdown al hacer clic fuera (un solo listener vivo a la vez)
    if (ofOutside) content.removeEventListener('click', ofOutside, true);
    ofOutside = function (e) { if (openKey && !e.target.closest('.fcol')) { openKey = null; redibujar(); } };
    content.addEventListener('click', ofOutside, true);
    redibujar();
  }

  // Modal de reasignación — lista de ejecutivos
  function abrirReasignar(ids, done) {
    if (!ids.length) return;
    var ejecutivos = distinct(OFERTAS.map(function (o) { return o.ejecutivo; })).sort();
    function pintar(q) {
      var lista = ejecutivos.filter(function (e) { return !q || e.toLowerCase().indexOf(q.toLowerCase()) !== -1; });
      abrirModal('<div class="modal-head"><h2>Reasignar ofertas</h2><button class="x" id="rsX">✕</button></div>' +
        '<p class="muted">Selecciona el ejecutivo para <b>' + ids.length + '</b> oferta(s):</p>' +
        '<input class="search" id="rsSearch" placeholder="Buscar ejecutivo…" value="' + esc(q || '') + '" style="margin:8px 0 0">' +
        '<div class="lista">' + (lista.length ? lista.map(function (e) { return '<button data-e="' + esc(e) + '"><b>' + esc(e) + '</b></button>'; }).join('') : '<div class="fempty">Sin ejecutivos.</div>') + '</div>');
      document.getElementById('rsX').onclick = cerrarModal;
      var s = document.getElementById('rsSearch');
      s.oninput = function () { var v = s.value; pintar(v); var n = document.getElementById('rsSearch'); if (n) { n.focus(); n.setSelectionRange(v.length, v.length); } };
      document.querySelectorAll('[data-e]').forEach(function (b) {
        b.onclick = function () {
          var nombre = b.dataset.e;
          ids.forEach(function (id) { var o = OFERTAS.filter(function (x) { return x.idOferta === id; })[0]; if (o) o.ejecutivo = nombre; });
          cerrarModal(); done();
        };
      });
    }
    pintar('');
  }

  // Construye una oferta nueva con valores por defecto (mismo shape que la semilla)
  function nuevaOfertaObj(rfc, tipoOferta, tipoPersona, familia) {
    var cat = SEED.catalogos || {};
    var prods = (cat.productosPorFamilia || {})[familia] || [familia];
    var hoy = new Date(); var f = pad2(hoy.getDate()) + '/' + pad2(hoy.getMonth() + 1) + '/' + hoy.getFullYear();
    return {
      idOferta: 'OFR' + Date.now(), rfc: rfc, ejecutivo: 'Usuario', tipoOferta: tipoOferta,
      tipoPersona: tipoPersona || 'Persona Fisica', familia: familia, producto: prods[0] || familia,
      etapa: 'No contactado', subEtapa: '', monto: 0, fechaCierre: '',
      fechaCreacion: f, fechaVencimiento: '', campana: '', folio: '', numeroLinea: '',
      origen: '', motivoDescarte: '', montoFijo: 0, montoRevolvente: 0, tasaInicial: 0,
      catInicial: 0, plazo: 0, periodo: 0, descripcion: '', notas: []
    };
  }

  // Wizard Nueva oferta (2 pasos: tipo → cliente/prospecto)
  var RFC_LEN_ = { PF: 13, PFAE: 13, PM: 12 };
  function abrirNuevaOferta(tipoInicial) {
    var st = { tipo: tipoInicial || '', clienteSel: null };
    function done() { if (OF_REFRESH) OF_REFRESH(); }
    function familiaSelect(id) { return '<select id="' + id + '"><option value="">— Selecciona familia —</option>' + SEED.familias.map(function (fa) { return '<option>' + esc(fa) + '</option>'; }).join('') + '</select>'; }
    function err(t) { var e = document.getElementById('noErr'); if (e) e.textContent = t || ''; }

    function pintar() {
      var titulo = st.tipo ? ('Nueva oferta — ' + st.tipo) : 'Nueva oferta';
      var cuerpo;
      if (!st.tipo) {
        cuerpo = '<p class="muted">¿La oferta es de un cliente o de un prospecto?</p>' +
          '<div class="two" style="margin-top:8px">' +
          '<button class="flash" id="optCli"><div class="fi">🏦</div><div class="ft">Cliente</div><div class="muted">Buscar un cliente existente por nombre o RFC.</div></button>' +
          '<button class="flash" id="optPro"><div class="fi">🌱</div><div class="ft">Prospecto</div><div class="muted">Capturar un nuevo prospecto.</div></button></div>';
      } else if (st.tipo === 'Cliente') {
        cuerpo = '<div class="field"><div class="fl">Buscar cliente (nombre o RFC)</div><input type="text" id="noQ" placeholder="Escribe nombre o RFC…" style="width:100%"></div>' +
          '<div id="noResults"></div>' +
          (st.clienteSel ? '<div style="color:#ea580c;font-size:14px;margin:6px 0">Cliente: <b>' + esc(st.clienteSel.nombre) + '</b> (' + esc(st.clienteSel.rfc) + ')</div>' : '') +
          '<div class="field"><div class="fl">Familia de producto</div>' + familiaSelect('noFam') + '</div>';
      } else {
        cuerpo = '<div class="field"><div class="fl">Nombre completo</div><input type="text" id="pNombre" style="width:100%"></div>' +
          '<div class="field"><div class="fl">Tipo de persona</div><select id="pTipo"><option value="">— Selecciona —</option>' +
          '<option value="PF">PF — Persona Física (RFC 13)</option><option value="PFAE">PFAE — Persona Física con Actividad Empresarial (RFC 13)</option><option value="PM">PM — Persona Moral (RFC 12)</option></select></div>' +
          '<div class="field"><div class="fl">RFC</div><input type="text" id="pRfc" style="width:100%"></div>' +
          '<div class="two"><div class="field"><div class="fl">Correo</div><input type="email" id="pCorreo"></div>' +
          '<div class="field"><div class="fl">Teléfono</div><input type="tel" id="pTel"></div></div>' +
          '<div class="field"><div class="fl">Familia de producto</div>' + familiaSelect('noFam') + '</div>';
      }
      abrirModal('<div class="modal-head"><h2>' + esc(titulo) + '</h2><button class="x" id="noX">✕</button></div>' + cuerpo +
        '<p id="noErr" style="color:#dc2626;font-size:14px;margin-top:8px"></p>' +
        (st.tipo ? '<div style="display:flex;justify-content:space-between;margin-top:12px">' +
          '<button class="btn btn-ghost" id="noBack">‹ Cambiar tipo</button>' +
          '<button class="btn btn-primary" id="noCrear">Crear oferta</button></div>' : ''));
      document.getElementById('noX').onclick = cerrarModal;
      if (!st.tipo) {
        document.getElementById('optCli').onclick = function () { st.tipo = 'Cliente'; pintar(); };
        document.getElementById('optPro').onclick = function () { st.tipo = 'Prospecto'; pintar(); };
        return;
      }
      document.getElementById('noBack').onclick = function () { st.tipo = ''; st.clienteSel = null; pintar(); };
      if (st.tipo === 'Cliente') bindCliente(); else bindProspecto();
    }

    function bindCliente() {
      var q = document.getElementById('noQ');
      q.oninput = function () {
        var v = q.value.trim().toLowerCase(); var box = document.getElementById('noResults');
        if (v.length < 2) { box.innerHTML = ''; return; }
        var res = []; for (var k in CLIENTES) { var c = CLIENTES[k]; if (c.esCliente && (c.nombre + ' ' + c.rfc).toLowerCase().indexOf(v) !== -1) res.push(c); }
        box.innerHTML = res.length ? '<div class="lista">' + res.slice(0, 20).map(function (c) { return '<button data-rfc="' + esc(c.rfc) + '"><b>' + esc(c.nombre) + '</b> · ' + esc(c.rfc) + '</button>'; }).join('') + '</div>' : '<div class="fempty">Sin coincidencias.</div>';
        box.querySelectorAll('[data-rfc]').forEach(function (b) { b.onclick = function () { st.clienteSel = CLIENTES[b.dataset.rfc]; pintar(); }; });
      };
      document.getElementById('noCrear').onclick = function () {
        if (!st.clienteSel) { err('Selecciona un cliente de la búsqueda.'); return; }
        var fam = document.getElementById('noFam').value; if (!fam) { err('Selecciona una familia de producto.'); return; }
        OFERTAS.unshift(nuevaOfertaObj(st.clienteSel.rfc, 'Cliente', st.clienteSel.tipoPersona, fam));
        cerrarModal(); done();
      };
    }

    function bindProspecto() {
      document.getElementById('noCrear').onclick = function () {
        var nombre = document.getElementById('pNombre').value.trim();
        var tp = document.getElementById('pTipo').value;
        var rfc = document.getElementById('pRfc').value.trim().toUpperCase();
        var correo = document.getElementById('pCorreo').value.trim();
        var tel = document.getElementById('pTel').value.trim();
        var fam = document.getElementById('noFam').value;
        if (!nombre) { err('Captura el nombre completo.'); return; }
        if (!tp) { err('Selecciona el tipo de persona.'); return; }
        if (!rfc) { err('Captura el RFC.'); return; }
        if (!/^[A-ZÑ&0-9]+$/.test(rfc)) { err('El RFC debe ser alfanumérico (A-Z, 0-9).'); return; }
        if (rfc.length !== RFC_LEN_[tp]) { err('El RFC de ' + tp + ' debe tener ' + RFC_LEN_[tp] + ' caracteres.'); return; }
        if (!correo && !tel) { err('Captura al menos un correo o un teléfono.'); return; }
        if (!fam) { err('Selecciona una familia de producto.'); return; }
        var tipoPersona = tp === 'PM' ? 'Persona Moral' : tp === 'PFAE' ? 'Persona Fisica con Actividad Empresarial' : 'Persona Fisica';
        var cli = { rfc: rfc, nombre: nombre, tipoPersona: tipoPersona, segmento: 'Personal', telefonos: tel, correo: correo, direccion: '', numero: '', esCliente: false, estatus: 'Prospecto', nacioComoProspecto: true, fechaConversion: '', contratos: [], campanas: [], comunicaciones: [], aclaraciones: [], nps: { score: 0, categoria: 'Pasivo' }, recomendacion: null };
        CLIENTES[rfc] = cli; SEED.clientes.push(cli);

  // ----- Asistente de Ofertas (panel lateral, local + n8n) -----
  function resolverRfcOf(texto) {
    var t = texto.toUpperCase();
    for (var k in CLIENTES) { var c = CLIENTES[k]; if ((c.rfc && t.indexOf(c.rfc.toUpperCase()) !== -1) || (c.numero && texto.indexOf(c.numero) !== -1)) return c.rfc; }

  }

  function montarAsistenteOfertas(host) {
    var sid = 'ofertas_' + Date.now(); var loading = false;
    var msgs = [{ t: 'bot', x: 'Soy tu asistente de gestión de ofertas. Puedo crear ofertas, localizar un cliente/prospecto por RFC o número, y decirte qué ofertas o campañas tiene.' }];
    host.innerHTML = '<div class="asx"><div class="asx-head">🤖 Asistente de Ofertas <span style="margin-left:auto;font-size:12px;color:#16a34a;display:flex;align-items:center;gap:4px"><span class="dot"></span> En línea</span></div>' +
      '<div class="asx-msgs" id="ofAsMsgs"></div><div class="asx-chips" id="ofAsChips"></div>' +
      '<div class="asx-foot"><input id="ofAsInput" type="text" placeholder="Escribe una instrucción…"><button class="btn btn-primary" id="ofAsSend">➤</button></div></div>';
    var msgsEl = document.getElementById('ofAsMsgs'), chipsEl = document.getElementById('ofAsChips');
    function add(t, x) { msgs.push({ t: t, x: x }); pint(); }
    function pint() { msgsEl.innerHTML = msgs.map(function (m) { return '<div class="asx-msg ' + (m.t === 'bot' ? 'bot' : 'user') + '">' + esc(m.x) + '</div>'; }).join('') + (loading ? '<div class="asx-msg bot"><span class="typing"><span></span><span></span><span></span></span></div>' : ''); msgsEl.scrollTop = msgsEl.scrollHeight; }
    function responder(texto) {
      var t = texto.toLowerCase();
      if (/(crea|crear|nueva|alta).*(prospecto)/.test(t)) { add('bot', 'Abriendo el asistente para crear una oferta de prospecto…'); abrirNuevaOferta('Prospecto'); return true; }
      if (/(crea|crear|nueva|alta).*(cliente|oferta)/.test(t)) { add('bot', 'Abriendo el asistente para crear una oferta de cliente…'); abrirNuevaOferta('Cliente'); return true; }
      var rfc = resolverRfcOf(texto);

        var cli = CLIENTES[rfc], quien = cli ? (cli.nombre + ' (' + rfc + ')') : ('RFC ' + rfc);

        add('bot', 'Ofertas de ' + quien + ':\n' + resumenOfertasOf(rfc)); return true;

    function enviar(texto) {

    }

    chipsEl.innerHTML = chips.map(function (c, i) { return '<button class="asx-chip" data-chip="' + i + '">' + c[0] + '</button>'; }).join('');
    chipsEl.querySelectorAll('[data-chip]').forEach(function (b) { b.onclick = chips[parseInt(b.dataset.chip, 10)][1]; });
    document.getElementById('ofAsSend').onclick = function () { enviar(); };

  function opcionesOferta(of, tipo) {

  function attachOferta(of, i, rerender) {

  // ========== CICLO 360 (vista por pestañas, reutilizable) ==========
  var C360_COLORS = ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ef4444', '#06b6d4', '#ec4899'];
  var C360_MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  function dmyKey(f) { var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(f || ''); return m ? m[3] + '-' + m[2] : ''; }

  function montarCiclo360(host, cli) {
    var esCli = cli.esCliente;
    var contratos = cli.contratos || [], variaciones = cli.variaciones || [], ingresos = cli.ingresos || [];
    var timbrado = cli.timbrado || [], tpv = cli.tpv || [], denuncias = cli.denuncias || [];

    var nps = cli.nps || { score: 0, categoria: 'Pasivo' }, rec = cli.recomendacion;

    // Cálculos financieros
    var saldoTotal = contratos.reduce(function (s, c) { return s + (c.saldoActual || 0); }, 0);
    var saldoVencido = contratos.reduce(function (s, c) { return s + (c.saldoVencido || 0); }, 0);
    var activos = contratos.filter(function (c) { return c.estatus === 'Activo'; });
    var enMora = contratos.filter(function (c) { return (c.diasMora || 0) > 0; });
    var lineasCredito = contratos.filter(function (c) { return c.tipo === 'Crédito' || c.tipo === 'TDC'; });
    var porVencer = lineasCredito.filter(function (c) { return c.porVencer; });

    // Distribución de saldo por tipo (donut)
    var distMap = {}; contratos.forEach(function (c) { if (c.saldoActual > 0) distMap[c.tipo] = (distMap[c.tipo] || 0) + c.saldoActual; });
    var distrib = Object.keys(distMap).map(function (t, idx) { return { tipo: t, val: distMap[t], color: C360_COLORS[idx % C360_COLORS.length] }; });
    var distTotal = distrib.reduce(function (s, d) { return s + d.val; }, 0);

    // Movimientos mensuales (últimos 6 meses)
    var mm = {}; variaciones.forEach(function (v) { var k = dmyKey(v.fecha); if (!k) return; if (!mm[k]) mm[k] = { ingreso: 0, egreso: 0 }; if (v.montoMovimiento >= 0) mm[k].ingreso += v.montoMovimiento; else mm[k].egreso += Math.abs(v.montoMovimiento); });
    var mensual = Object.keys(mm).sort().slice(-6).map(function (k) { return { label: C360_MESES[Number(k.slice(5, 7)) - 1] + ' ' + k.slice(2, 4), ingreso: mm[k].ingreso, egreso: mm[k].egreso }; });
    var maxMov = Math.max.apply(null, [1].concat(mensual.map(function (m) { return Math.max(m.ingreso, m.egreso); })));

    var TABS = [{ k: 'resumen', l: 'Resumen' }];
    if (esCli) TABS.push({ k: 'productos', l: 'Productos', n: contratos.length }, { k: 'saldos', l: 'Saldos y mora' }, { k: 'vencer', l: 'Líneas por vencer', n: porVencer.length }, { k: 'movimientos', l: 'Movimientos', n: variaciones.length }, { k: 'ingresos', l: 'Ingresos NF', n: ingresos.length });
    TABS.push({ k: 'ofertas', l: 'Ofertas', n: ofs.length }, { k: 'comunicaciones', l: 'Comunicaciones', n: coms.length }, { k: 'aclaraciones', l: 'Aclaraciones', n: acls.length });
    if (denuncias.length) TABS.push({ k: 'denuncias', l: 'Denuncias', n: denuncias.length });

    var st = { tab: 'resumen', canal: '', aclTipo: '', aclEstatus: '', exp: null };

    function moraPill(c) { return pill(c.bucketMora, (c.diasMora || 0) > 0 ? 'pill-bad' : 'pill-gray'); }
    function empty(t) { return '<div class="muted" style="padding:10px 0">' + esc(t) + '</div>'; }

    function header() {
      return '<div class="card card-pad"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">' +

  function mask4(s) { var v = String(s || ''); return v.length > 4 ? '•••• ' + v.slice(-4) : v; }

  // ---------- contacto (wa/mail/call + agregar método) ----------
  function attachContacto(root, cli) {
    var cont = root.querySelector('#contacto'); if (!cont) return;
    var canal = null, destino = '', addOpen = false, addTipo = 'tel', addMsg = '';
    function pintar() {
      var tels = listar(cli.telefonos), mails = listar(cli.correo);
      var opts = canal === 'Correo' ? mails : tels;
      cont.innerHTML =
        '<div><button class="btn btn-wa" data-c="WhatsApp">💬 WhatsApp</button> ' +
        '<button class="btn btn-mail" data-c="Correo">✉ Correo</button> ' +
        '<button class="btn btn-call" data-c="Llamada">📞 Llamada</button> ' +
        '<button class="btn btn-ghost" id="cAddBtn">＋ Agregar método de contacto</button></div>' +
        (addOpen ? ('<div class="card card-pad" style="margin-top:10px;background:#f0fdf4">' +
          '<div style="display:flex;gap:8px;margin-bottom:8px"><select id="cAddTipo"><option value="tel"' + (addTipo === 'tel' ? ' selected' : '') + '>Teléfono</option><option value="mail"' + (addTipo === 'mail' ? ' selected' : '') + '>Correo</option></select>' +
          '<input type="' + (addTipo === 'mail' ? 'email' : 'tel') + '" id="cAddVal" placeholder="' + (addTipo === 'mail' ? 'correo@dominio.com' : '10 dígitos') + '" style="flex:1">' +
          '<button class="btn btn-primary" id="cAddSave">Guardar</button></div>' +
          (addMsg ? '<div class="muted">' + esc(addMsg) + '</div>' : '') + '</div>') : '') +
        (canal ? ('<div class="card card-pad" style="margin-top:10px;background:#fff7ed">' +
          '<div class="muted" style="margin-bottom:6px">' + (canal === 'Correo' ? 'Selecciona o escribe el correo:' : 'Selecciona o escribe el teléfono:') + '</div>' +
          '<div>' + opts.map(function (o) { return '<span class="chip ' + (destino === o ? 'sel' : '') + '" data-o="' + esc(o) + '">' + esc(o) + '</span>'; }).join('') + '</div>' +
          '<div style="display:flex;gap:8px;margin-top:8px">' +
          '<input type="' + (canal === 'Correo' ? 'email' : 'tel') + '" id="cDest" placeholder="' + (canal === 'Correo' ? 'correo@dominio.com' : '10 dígitos') + '" value="' + esc(destino) + '" style="flex:1">' +
          '<button class="btn btn-primary" id="cGo">Iniciar ' + canal + '</button></div></div>') : '');
      cont.querySelectorAll('[data-c]').forEach(function (b) { b.onclick = function () { canal = (canal === b.dataset.c ? null : b.dataset.c); destino = ''; pintar(); }; });
      cont.querySelectorAll('[data-o]').forEach(function (ch) { ch.onclick = function () { destino = ch.dataset.o; pintar(); }; });
      var inp = cont.querySelector('#cDest'); if (inp) inp.oninput = function () { destino = inp.value; };
      var go = cont.querySelector('#cGo'); if (go) go.onclick = iniciar;
      cont.querySelector('#cAddBtn').onclick = function () { addOpen = !addOpen; addMsg = ''; pintar(); };
      var at = cont.querySelector('#cAddTipo'); if (at) at.onchange = function () { addTipo = at.value; addMsg = ''; pintar(); };
      var as = cont.querySelector('#cAddSave'); if (as) as.onclick = agregar;
    }
    function agregar() {
      var v = (cont.querySelector('#cAddVal').value || '').trim();
      if (addTipo === 'mail') {
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { addMsg = '⚠ Correo no válido.'; pintar(); return; }
        cli.correo = cli.correo ? (cli.correo + ', ' + v) : v;
      } else {
        if (digitos(v).length < 10) { addMsg = '⚠ El teléfono debe tener al menos 10 dígitos.'; pintar(); return; }
        cli.telefonos = cli.telefonos ? (cli.telefonos + ', ' + v) : v;
      }
      addOpen = false; addMsg = ''; pintar();
    }
    function iniciar() {
      var d = (cont.querySelector('#cDest') ? cont.querySelector('#cDest').value : destino).trim(); if (!d) return;
      if (canal === 'WhatsApp') window.open('https://wa.me/' + wa(d), '_blank');
      else if (canal === 'Llamada') window.open('tel:' + digitos(d), '_self');
      else window.open('mailto:' + d, '_self');
    }
    pintar();
  }

    });
    var store = AGENDA_EVENTOS.filter(function (e) { return e.fecha === key; }).map(function (e) {
      return { id: e.id, titulo: e.nombre, horaInicio: e.hora || '09:00', duracion: e.duracion || 60, tipo: e.tipo === 'reunion' ? 'reunion' : 'otro', cliente: e.cliente, completada: !!e.completado, esPlaneada: !!e.esPlaneada, color: e.tipo === 'reunion' ? '#7c3aed' : '#14b8a6', store: true };
    });
    return base.concat(store);

  // ========== CHAT DE DATOS (sql.js + n8n) ==========
  var SQLDB = null;
  function ensureDb(cb) {
    if (SQLDB) { cb(); return; }
    if (!(typeof google !== 'undefined' && google.script && google.script.run)) { cb('preview'); return; }
    function build(SQL) {
      google.script.run.withSuccessHandler(function (seed) {
        var db = new SQL.Database();
        Object.keys(seed).forEach(function (tn) {
          var rows = seed[tn]; if (!rows || !rows.length) return;
          var cols = Object.keys(rows[0]);
          db.run('CREATE TABLE ' + tn + ' (' + cols.join(',') + ')');
          var st = db.prepare('INSERT INTO ' + tn + ' VALUES (' + cols.map(function () { return '?'; }).join(',') + ')');
          rows.forEach(function (row) { st.run(cols.map(function (c) { return row[c] === undefined || row[c] === '' ? null : row[c]; })); });
          st.free();
        });
        SQLDB = db; cb();
      }).withFailureHandler(function () { cb('err'); }).getDbSeed();
    }
    if (typeof initSqlJs !== 'undefined') { initSqlJs({ locateFile: function (f) { return 'https://sql.js.org/dist/' + f; } }).then(build).catch(function () { cb('err'); }); }
    else { var s = document.createElement('script'); s.src = 'https://sql.js.org/dist/sql-wasm.js'; s.onload = function () { initSqlJs({ locateFile: function (f) { return 'https://sql.js.org/dist/' + f; } }).then(build).catch(function () { cb('err'); }); }; s.onerror = function () { cb('err'); }; document.head.appendChild(s); }
  }
  function calcKpi(vals, idx, ag) {
    if (idx < 0) return '';
    var col = vals.map(function (r) { return r[idx]; });
    if (ag === 'first') return col[0];
    if (ag === 'count') return col.length;
    var nums = col.map(Number).filter(function (n) { return !isNaN(n); });
    if (ag === 'sum') return nums.reduce(function (a, b) { return a + b; }, 0);
    if (ag === 'avg') return nums.length ? Math.round(nums.reduce(function (a, b) { return a + b; }, 0) / nums.length) : 0;
    if (ag === 'max') return Math.max.apply(null, nums);
    if (ag === 'min') return Math.min.apply(null, nums);
    return col[0];
  }
  function fmtKpi(v, f) { if (f === 'moneda') return money(v); if (f === 'porcentaje') return v + '%'; return esc(v); }
  function renderResultado(resp) {
    if (!resp || (!resp.sql && !resp.presentacion)) return '<div class="muted">' + esc((resp && (resp.mensaje || resp.output)) || 'Sin respuesta.') + '</div>';
    if (!resp.sql) return '<div class="muted">' + esc(resp.mensaje || resp.output || '') + '</div>';
    var res; try { res = SQLDB.exec(resp.sql); } catch (e) { return '<div class="muted">Error SQL: ' + esc(e) + '</div>'; }
    if (!res.length) return '<div class="muted">Sin resultados.</div>';
    var cols = res[0].columns, vals = res[0].values, pres = resp.presentacion || {};
    var html = pres.titulo ? '<b>' + esc(pres.titulo) + '</b>' : '';
    if (pres.kpis && pres.kpis.length) html += '<div class="kpis" style="margin:8px 0">' + pres.kpis.map(function (k) { return kpi(k.etiqueta, fmtKpi(calcKpi(vals, cols.indexOf(k.columna), k.agregado), k.formato)); }).join('') + '</div>';
    html += '<div style="overflow:auto"><table><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      vals.slice(0, 50).map(function (row) { return '<tr>' + row.map(function (x) { return '<td>' + esc(x) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';

    return html;
  }

  // ========== COTIZADOR DE CRÉDITOS ==========
  var COT_PRODUCTOS = {
    hipotecario: { nombre: 'Crédito Hipotecario', icono: '🏠', min: 1000000, max: 50000000, plazos: [10, 15, 20, 25, 30], unidad: 'años', tasas: { 10: 9.5, 15: 10.0, 20: 10.5, 25: 11.0, 30: 12.0 } },
    personal: { nombre: 'Crédito Personal', icono: '💳', min: 50000, max: 500000, plazos: [12, 18, 24], unidad: 'meses', tasas: { 12: 18, 18: 22, 24: 28 } },
    auto: { nombre: 'Crédito de Auto', icono: '🚗', min: 200000, max: 2000000, plazos: [12, 24, 36, 48, 60], unidad: 'meses', tasas: { 12: 12, 24: 13, 36: 14, 48: 16, 60: 18 } }
  };
  function cotMoney(n) { return '$' + Number(Math.round(n) || 0).toLocaleString('en-US'); }

  function calcularCotizacion(sol) {
    var cfg = COT_PRODUCTOS[sol.tipoCredito]; var monto = sol.monto, plazo = sol.plazo, enganche = sol.enganche || 0;
    if (!cfg) return { error: 'Tipo de crédito no válido.' };
    if (monto < cfg.min) return { error: 'El monto mínimo para ' + cfg.nombre + ' es ' + cotMoney(cfg.min) + '.' };
    if (monto > cfg.max) return { error: 'El monto máximo para ' + cfg.nombre + ' es ' + cotMoney(cfg.max) + '.' };
    var tasa;
    if (sol.tipoCredito === 'hipotecario') { var anios = Math.round(plazo / 12); tasa = cfg.tasas[anios] || 12; }
    else { tasa = cfg.tasas[plazo]; if (!tasa) { var vs = []; for (var k in cfg.tasas) vs.push(cfg.tasas[k]); tasa = vs[vs.length - 1] || 12; } }
    var financiar = monto - enganche;
    if (financiar <= 0) return { error: 'El enganche no puede ser mayor o igual al monto.' };
    var tm = tasa / 100 / 12, factor = Math.pow(1 + tm, plazo);
    var pago = financiar * (tm * factor) / (factor - 1);
    var total = pago * plazo, intereses = total - financiar;
    var tabla = [], saldo = financiar;
    for (var mes = 1; mes <= plazo; mes++) {
      var im = saldo * tm, cm = pago - im; saldo = saldo - cm;
      tabla.push({ mes: mes, pago: pago, capital: cm, interes: im, saldo: Math.max(0, saldo) });
    }
    return {
      producto: cfg.nombre, montoSolicitado: monto, enganche: enganche, montoFinanciar: financiar,
      tasaAnual: tasa, plazoMeses: plazo, pagoMensual: pago, totalAPagar: total, interesesTotales: intereses,
      tabla: tabla, mensaje: '¡Listo! Tu cotización de ' + cfg.nombre + ' está calculada.'
    };
  }

  // NLP simple: detecta tipo, monto, plazo, enganche
  function cotProcesar(texto, ctx) {
    var low = texto.toLowerCase(), tipo = null;
    if (/hipotec|casa|vivienda/.test(low)) tipo = 'hipotecario';
    else if (/auto|carro|coche|veh[ií]culo/.test(low)) tipo = 'auto';
    else if (/personal|pr[ée]stamo|prestamo/.test(low)) tipo = 'personal';
    if (!tipo && ctx.tipoCredito) tipo = ctx.tipoCredito;
    if (tipo) ctx.tipoCredito = tipo;

    var monto = 0, mm = texto.match(/\$?\s*([0-9][0-9,]*(?:\.[0-9]+)?)\s*(millones?|mill[oó]n|mil|pesos|mxn)?/i);
    if (mm && mm[1]) { monto = parseFloat(mm[1].replace(/,/g, '')); var u = (mm[2] || '').toLowerCase(); if (u.indexOf('mill') !== -1) monto *= 1000000; else if (u.indexOf('mil') !== -1) monto *= 1000; }
    var plazo = 0, pm = texto.match(/(\d+)\s*(a[ñn]os?|meses?)/i);
    if (pm && pm[1]) { plazo = parseInt(pm[1], 10); if (/^a/i.test(pm[2])) plazo *= 12; }
    var em = texto.match(/enganche[:\s]+\$?\s*([0-9][0-9,]*)/i), enganche = em ? parseFloat(em[1].replace(/,/g, '')) : 0;

    if (tipo && monto > 0 && plazo > 0) {
      var cot = calcularCotizacion({ tipoCredito: tipo, monto: monto, plazo: plazo, enganche: enganche });
      return { respuesta: cot.error || cot.mensaje, cotizacion: cot.error ? null : cot };
    }
    if (tipo) {
      var cfg = COT_PRODUCTOS[tipo];
      return { respuesta: 'Para cotizar tu ' + cfg.nombre + ' necesito:\n• Monto: desde ' + cotMoney(cfg.min) + '\n• Plazo: ' + cfg.plazos.join(', ') + ' ' + cfg.unidad + '\n• Enganche (opcional)\n\nEjemplo: "2 millones a 20 años" o "500 mil a 36 meses con enganche 100000".' };
    }
    return { respuesta: '¿Qué crédito te interesa cotizar?\n🏠 Hipotecario · 🚗 Auto · 💳 Personal' };
  }

  function cotCardHtml(cot, idx, abierto) {

      '<h1>🧮 Cotización — ' + esc(cot.producto) + '</h1>' +
      '<div><span class="k">Pago mensual <b>' + cotMoney(cot.pagoMensual) + '</b></span><span class="k">Tasa anual <b>' + cot.tasaAnual + '%</b></span>' +
      '<span class="k">Monto a financiar <b>' + cotMoney(cot.montoFinanciar) + '</b></span><span class="k">Enganche <b>' + cotMoney(cot.enganche) + '</b></span>' +
      '<span class="k">Total a pagar <b>' + cotMoney(cot.totalAPagar) + '</b></span><span class="k">Intereses <b>' + cotMoney(cot.interesesTotales) + '</b></span>' +
      '<span class="k">Plazo <b>' + cot.plazoMeses + ' meses</b></span></div>' +
      '<table><thead><tr><th>Mes</th><th>Pago</th><th>Capital</th><th>Interés</th><th>Saldo</th></tr></thead><tbody>' + filas + '</tbody></table>' +
      '</body></html>');
    w.document.close(); w.focus(); setTimeout(function () { w.print(); }, 300);

  // Extrae parámetros de cotización del JSON del agente (resp directo o embebido en el texto)
  function cotParams(resp, out) {
    function fromObj(o) { if (o && o.tipoCredito && o.monto && o.plazo) return { tipoCredito: String(o.tipoCredito).toLowerCase(), monto: Number(o.monto), plazo: Number(o.plazo), enganche: Number(o.enganche) || 0 }; return null; }
    var p = fromObj(resp); if (p) return p;
    var s = String(out || '').trim();
    if (s.indexOf('```') !== -1) s = s.replace(/```json/gi, '').replace(/```/g, '').trim();
    if (s.charCodeAt(0) === 123) { try { return fromObj(JSON.parse(s)); } catch (e) { } } // 123 = llave de apertura
    return null;
  }
  // Interpreta la respuesta del agente n8n; cae al cálculo local si no hay agente o no devuelve cotización
  function cotInterpretar(resp, texto, ctx) {
    resp = resp || {};
    var out = '';
    if (Object.prototype.toString.call(resp) === '[object Array]') { var r0 = resp[0] || {}; out = r0.output || r0.text || r0.mensaje || ''; }
    else out = resp.output || resp.text || resp.response || resp.mensaje || '';
    // Agente no disponible (preview) o error → cálculo local con NLP
    if (!out || /Disponible al publicar|No pude consultar|Canal n8n desconocido|Error\b/i.test(out)) return cotProcesar(texto, ctx);
    // ¿El agente devolvió parámetros? → calcular y mostrar tarjeta
    var p = cotParams(resp, out);
    if (p) { var cot = calcularCotizacion(p); if (p.tipoCredito) ctx.tipoCredito = p.tipoCredito; return { respuesta: cot.error || cot.mensaje || out, cotizacion: cot.error ? null : cot }; }
    // Texto del agente + intento de cotización local sobre el mensaje del usuario
    var local = cotProcesar(texto, ctx);
    return { respuesta: out, cotizacion: local.cotizacion };
  }
